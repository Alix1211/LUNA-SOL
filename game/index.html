<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNA SOL · 황혼의 성</title>
<link rel="stylesheet" href="style.css">
<script defer src="story.js"></script>
<script defer src="north-tower.js"></script>
<script defer src="residence.js"></script>
<script defer src="game.js"></script>
</head>
<body>
<header class="mast"><a class="wordmark" href="index.html" aria-label="루나솔">LUNA <i>✦</i> SOL</a><span>제1부 · 황혼의 성</span><button id="fullscreen" class="utility" type="button" aria-pressed="false">⛶ 전체화면</button><button id="places" class="utility" type="button" hidden>◇ 장소</button></header>
<main>
<section class="world" id="world" aria-label="성의 풍경">
  <img id="landscape" class="landscape" alt="">
  <div class="landscrim"></div>
  <div id="room-objects" class="room-objects" hidden></div>
  <div id="location" class="location"></div>
  <button id="hotspot" class="hotspot" type="button" hidden><span aria-hidden="true">✦</span><span id="hotspot-label"></span></button>
  <nav id="map" class="map" aria-label="성의 장소" hidden></nav>
  <img class="portrait" id="portrait" alt="" hidden>
  <div class="scene-card" id="scene-card">
    <p id="speaker" class="speaker"></p>
    <h1 id="scene-title"></h1>
    <p id="copy"></p>
    <button class="primary" id="scene-action" type="button"></button>
  </div>
  <section id="residence" class="residence" aria-label="작은 방 꾸미기" hidden>
    <div class="residence-heading"><h1>작은 방</h1><span id="residence-gold"></span></div>
    <p id="residence-feedback" role="status"></p>
    <button id="continue-story" class="primary" type="button"></button>
    <section class="residence-group"><h2>가구 배치</h2><div id="space-controls"></div></section>
    <section class="residence-group"><h2>제작과 주민 주문</h2><div id="residence-jobs"></div></section>
    <button id="expand-storage" class="utility" type="button"></button>
  </section>
</section>
<section id="work" class="work" aria-label="머지 작업대" hidden>
  <img class="work-bg" id="work-bg" aria-hidden="true" alt="">
  <div class="work-header"><button id="back" class="utility" type="button">← 성으로</button><h1>복원 작업대</h1></div>
  <div id="board" class="board" role="group" aria-label="8×8 머지판"></div>
  <aside class="mission-card">
    <h2 id="mission-title"></h2><p id="mission-tip"></p>
    <div id="goals"></div>
    <button id="deliver-selection" class="primary" type="button">납품하기</button>
    <button id="undo-delivery" class="utility" type="button" hidden>최근 납품 회수</button>
    <div class="storage-controls">
      <button id="store-item" class="utility" type="button" disabled>선택 재료 보관</button>
      <button id="free-cell" class="utility" type="button" hidden>선택 재료 임시 회수</button>
      <button id="recover-cell" class="utility" type="button" hidden>회수한 물건 되찾기</button>
      <details id="storage"><summary>보관함 <span id="storage-count">0</span></summary><div id="stored-items"></div></details>
    </div>
    <p id="status" class="status" role="status"></p>
  </aside>
</section>
</main>
</body>
</html>
